excerpt:'Design, vidéo et web : pourquoi la polyvalence est un atout stratégique pour vos projets.',
content:`Dans le monde du multimédia, la frontière entre le design, la vidéo et le web s'efface de plus en plus. Aujourd'hui, avoir un profil polyvalent sous la main, ce n'est pas juste un bonus : c'est un véritable atout stratégique pour faire avancer un projet sans perdre de temps. Voici pourquoi miser sur la polyvalence change la donne.

## Une vision globale, de l'idée au résultat final
Un créatif polyvalent ne voit pas un projet par un seul petit bout de la lorgnette. Il comprend l'ensemble du processus :
- **Cohérence visuelle :** concevoir une affiche ou un visuel, c'est bien, mais penser immédiatement à la façon dont il va s'animer en vidéo ou s'intégrer proprement sur un site web, c'est encore mieux.
- **Anticipation des contraintes :** connaître le code évite de créer des designs impossibles à intégrer, et maîtriser le montage permet d'adapter les contenus aux bons formats (Reels, web, prints) dès le départ.

## Une communication directe et zéro perte de temps
Enchaîner les intermédiaires (un designer, puis un monteur, puis un dev) finit souvent par créer de l'attente inutile.
- **Un interlocuteur unique :** les échanges restent simples, fluides et rapides.
- **Le bon vocabulaire :** parler la langue des graphistes et celle du code permet de faire le pont entre l'intention artistique et la réalité technique sans aucune friction.

## Agilité et réactivité sur le terrain
Sur un projet, les imprévus ou les petits ajustements de dernière minute arrivent toujours.
- **Adaptabilité immédiate :** besoin d'une retouche photo rapide, d'une modification sur une vidéo ou d'un ajustement d'interface ? Tout peut être réglé directement, sans dépendre d'un prestataire externe.
- **Optimisation des ressources :** moins de temps perdu en coordination signifie un projet qui avance plus vite et un budget mieux géré.

## En résumé
Recruter un profil polyvalent, c'est choisir la fluidité, la réactivité et une direction artistique cohérente de bout en bout. C'est transformer des compétences variées en une seule force d'exécution au service de vos idées.`

const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inl = s => esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');

const HEAD = /^##(?!#)\s*(\S.*)$/;

function md(t){
const out=[]; let list=false, hn=0, blanks=0;
String(t||'').split('\n').forEach(l=>{
l=l.trim();
if(!l){ blanks++; return; }
if(blanks>1){
if(list){out.push('</ul>');list=false}
out.push('<div style="height:'+((blanks-1)*28)+'px"></div>');
}
blanks=0;
if(l.startsWith('![') && l.includes('](')){
const match = l.match(/^!\[(.*?)\]\((.*?)\)$/);
if(match){ if(list){out.push('</ul>');list=false} out.push('<div style="text-align:center;margin:24px 0;"><img src="'+match[2]+'" alt="'+esc(match[1])+'" style="max-width:100%;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,0.5);border:1px solid rgba(255,255,255,0.08);"></div>'); return; }
}
if(l.startsWith('- ')){ if(!list){out.push('<ul>');list=true} out.push('<li>'+inl(l.slice(2))+'</li>'); return; }
if(list){out.push('</ul>');list=false}
const h = l.match(HEAD);
out.push(h ? '<h2 id="s'+(hn++)+'">'+inl(h[1])+'</h2>' : '<p>'+inl(l)+'</p>');
});
if(list) out.push('</ul>');
return out.join('');
}
const fmt = d => d ? new Date(d+'T00:00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'}) : '';
const rt = t => Math.max(1, Math.round(String(t||'').split(/\s+/).length/200));
const abs = p => /^https?:/.test(p) ? p : BASE + p;

let arts = [], current = 'tous', q = '';
const grid = document.getElementById('grid');

function card(a,i){
const c = CATS[a.cat] || CATS.autre;
return `<a class="card" style="--c:${c.c};animation-delay:${i*0.05}s" href="blog.html?a=${encodeURIComponent(a.slug)}">
<div class="thumb">${a.cover?`<img src="${esc(a.cover)}" alt="${esc(a.title)}" loading="${i<3?'eager':'lazy'}" decoding="async">`:`<i class="fas ${c.i}"></i>`}<span class="chip"><i class="fas ${c.i}"></i> ${c.l}</span></div>
<div class="body"><h2>${esc(a.title)}</h2><p>${esc(a.excerpt||'')}</p>
<div class="foot"><span>${fmt(a.date)}</span><span>${rt(a.content)} min de lecture</span></div></div></a>`;
}

const norm = s => String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
function showList(){
document.getElementById('listView').hidden = false;
const s = new URLSearchParams(location.search).get('s');
if(s && CATS[s]) current = s;
const f = document.getElementById('filters');
const n = k => arts.filter(a => a.cat===k).length;
f.innerHTML = `<button class="filter-chip" data-f="tous" aria-pressed="false"><i class="fas fa-border-all"></i> Tous <small>${arts.length}</small></button>` +
Object.entries(CATS).map(([k,c])=>`<button class="filter-chip${n(k)?'':' dim'}" data-f="${k}" aria-pressed="false"><i class="fas ${c.i}"></i> ${c.l} <small>${n(k)}</small></button>`).join('');
f.addEventListener('click', e=>{
const b = e.target.closest('.filter-chip'); if(!b) return;
current = b.dataset.f;
history.replaceState(null,'', current==='tous' ? 'blog.html' : 'blog.html?s='+current);
renderGrid();
});
document.getElementById('q').addEventListener('input', e => { q = norm(e.target.value.trim()); renderGrid(); });
renderGrid();
const ld = document.createElement('script'); ld.type='application/ld+json';
ld.textContent = JSON.stringify({"@context":"https://schema.org","@type":"ItemList","itemListElement":arts.map((a,i)=>({"@type":"ListItem","position":i+1,"url":BASE+'blog.html?a='+encodeURIComponent(a.slug),"name":a.title}))});
document.head.appendChild(ld);
}

function renderGrid(){
document.querySelectorAll('#filters .filter-chip').forEach(b => {
const on = b.dataset.f === current;
b.classList.toggle('active', on); b.setAttribute('aria-pressed', on);
});
const l = arts.filter(a => (current==='tous' || a.cat===current) && (!q || norm(a.title+' '+a.excerpt+' '+a.content).includes(q)));
document.getElementById('count').textContent = l.length+' article'+(l.length>1?'s':'')+(current!=='tous'?' · '+CATS[current].l:'')+(q?' · résultats de la recherche':'');
grid.innerHTML = l.length ? l.map(card).join('') : '<div class="empty"><p>Aucun article ne correspond pour le moment.</p><button class="reset" id="reset"><i class="fas fa-undo"></i> Voir tous les articles</button></div>';
const r = document.getElementById('reset');
if(r) r.onclick = () => { current='tous'; q=''; document.getElementById('q').value=''; history.replaceState(null,'','blog.html'); renderGrid(); };
}

function setMeta(sel, attr, v){ const e=document.querySelector(sel); if(e) e.setAttribute(attr, v); }

function showArticle(slug){
document.getElementById('listView').hidden = true;
const a = arts.find(x => x.slug===slug);
const v = document.getElementById('articleView');
v.hidden = false;
if(!a){
v.innerHTML = '<a class="back" href="blog.html"><i class="fas fa-arrow-left"></i> Tous les articles</a><h1>Article introuvable</h1><p style="color:var(--text-muted);margin-top:12px">Cet article n\'existe pas ou n\'est plus publié.</p>';
document.title = 'Article introuvable — Josy Ratovo';
setMeta('meta[name=robots]','content','noindex');
return;
}
const c = CATS[a.cat] || CATS.autre;
const url = BASE+'blog.html?a='+encodeURIComponent(a.slug);
const heads = String(a.content||'').split('\n').map(l=>l.trim()).filter(l=>HEAD.test(l)).map(l=>l.match(HEAD)[1].replace(/\*\*/g,''));
const toc = heads.length>=3 ? `<details class="toc"${innerWidth>600?' open':''}><summary><i class="fas fa-list"></i> Sommaire</summary><ol>${heads.map((h,i)=>`<li><a href="#s${i}">${esc(h)}</a></li>`).join('')}</ol></details>` : '';
const i = arts.findIndex(x => x.slug===slug), newer = arts[i-1], older = arts[i+1];
const link = (x,label,ic,cls) => `<a class="${cls}" href="blog.html?a=${encodeURIComponent(x.slug)}"><small><i class="fas ${ic}"></i> ${label}</small><b>${esc(x.title)}</b></a>`;
const pn = (newer||older) ? `<nav class="pn" aria-label="Autres articles">${older?link(older,'Article précédent','fa-arrow-left','l'):'<span></span>'}${newer?link(newer,'Article suivant','fa-arrow-right','r'):'<span></span>'}</nav>` : '';
const follow = `<div class="cta"><a href="${esc(INSTAGRAM_URL)}" target="_blank" rel="noopener"><i class="fab fa-instagram"></i> Me suivre sur Instagram</a></div>`;
const shareEnd = `<div class="share-mini"><button type="button" onclick="shareMini(event)" aria-label="Partager cet article" title="Partager"><i class="fas fa-share-alt"></i></button></div>`;
v.innerHTML = `<nav class="crumbs" aria-label="Fil d'Ariane"><a href="index.html">Accueil</a><i class="fas fa-chevron-right"></i><a href="blog.html">Blog</a><i class="fas fa-chevron-right"></i><a href="blog.html?s=${a.cat}">${c.l}</a></nav>
${a.cover?`<div class="cover"><img src="${esc(a.cover)}" alt="${esc(a.title)}" decoding="async"></div>`:''}
<span class="tag" style="--c:${c.c}">${c.l}</span>
<h1>${esc(a.title)}</h1>
<div class="meta"><span><i class="fas fa-user"></i>Josy Ratovo</span><span><i class="far fa-calendar"></i>${fmt(a.date)}</span><span><i class="far fa-clock"></i>${rt(a.content)} min de lecture</span></div>
${toc}
<div class="content">${md(a.content)}</div>
${follow}
${shareEnd}
${pn}
<div class="all"><a href="blog.html"><i class="fas fa-th-large"></i> Voir tous les articles</a></div>`;
const title = a.title+' | Josy Ratovo', desc = a.excerpt || a.title;
document.title = title;
setMeta('meta[name=description]','content',desc);
setMeta('link[rel=canonical]','href',url);
setMeta('meta[property="og:type"]','content','article');
setMeta('meta[property="og:title"]','content',title);
setMeta('meta[property="og:description"]','content',desc);
setMeta('meta[property="og:url"]','content',url);
if(a.cover && !a.cover.startsWith('data:')) setMeta('meta[property="og:image"]','content',abs(a.cover));
const ld = document.createElement('script'); ld.type='application/ld+json';
ld.textContent = JSON.stringify([
{"@context":"https://schema.org","@type":"BlogPosting","headline":a.title,"description":desc,"datePublished":a.date,"inLanguage":"fr","articleSection":c.l,"mainEntityOfPage":url,"image":(a.cover&&!a.cover.startsWith('data:'))?abs(a.cover):undefined,"author":{"@type":"Person","name":"Josy Ratovo"}},
{"@context":"https://schema.org","@type":"BreadcrumbList","itemListElement":[
{"@type":"ListItem","position":1,"name":"Accueil","item":BASE},
{"@type":"ListItem","position":2,"name":"Blog","item":BASE+'blog.html'},
{"@type":"ListItem","position":3,"name":c.l,"item":BASE+'blog.html?s='+a.cat},
{"@type":"ListItem","position":4,"name":a.title,"item":url}]}
]);
document.head.appendChild(ld);
const bar = document.getElementById('progress');
addEventListener('scroll', () => {
const h = document.documentElement, t = h.scrollHeight - h.clientHeight;
bar.style.width = (t>0 ? h.scrollTop/t*100 : 0) + '%';
}, {passive:true});
}

async function load(){
let remote = [];
try{
const s = await getDocs(query(collection(db,'articles'), where('published','==',true)));
s.forEach(d => remote.push({slug:d.id, ...d.data()}));
}catch(e){ console.warn('Articles Firestore indisponibles : affichage des articles intégrés.'); }
arts = [...remote, ...DEFAULT.filter(x => !remote.some(r => r.slug===x.slug))]
.map(a => ({...a, cat: CATS[a.cat] ? a.cat : 'autre'}))
.sort((a,b) => (b.date||'').localeCompare(a.date||''));
const slug = new URLSearchParams(location.search).get('a');
slug ? showArticle(slug) : showList();
}
load();

// PARTAGE
const widget = document.getElementById('shareWidget');
const icon = document.getElementById('shareIcon');
const toast = document.getElementById('toast');
if(navigator.share) document.getElementById('nativeItem').style.display='flex';
window.toggleShare = () => { const o = widget.classList.toggle('open'); icon.className = o ? 'fas fa-times' : 'fas fa-share-alt'; };
const closeShare = () => { widget.classList.remove('open'); icon.className='fas fa-share-alt'; };
function showToast(m){ toast.textContent=m; toast.classList.add('show'); setTimeout(()=>toast.classList.remove('show'),2200); }
window.shareTo = async p => {
const url = location.href.split('#')[0], text = document.title;
if(p==='whatsapp') window.open('https://wa.me/?text='+encodeURIComponent(text+' '+url),'_blank','noopener');
if(p==='facebook') window.open('https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(url),'_blank','noopener');
if(p==='copy'){ try{ await navigator.clipboard.writeText(url); showToast('Lien copié !'); }catch(e){ prompt('Copie ce lien :',url); } }
if(p==='native'){ try{ await navigator.share({title:text,url}); }catch(e){} }
closeShare();
};
window.shareMini = ev => {
ev.stopPropagation();
if(navigator.share){ window.shareTo('native'); }
else { widget.classList.add('open'); icon.className='fas fa-times'; }
};
document.addEventListener('click', e => { if(!widget.contains(e.target)) closeShare(); });
document.addEventListener('keydown', e => { if(e.key==='Escape') closeShare(); });
</script>
</body>
