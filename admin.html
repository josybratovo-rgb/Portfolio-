<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Administration — Blog</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--bg:#070a0e;--card:#16191d;--orange:#e05e00;--blue:#00b4d8;--muted:#a0aec0}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Arial,sans-serif}
body{background:var(--bg);color:#fff;padding:20px;display:flex;flex-direction:column;align-items:center;min-height:100vh}
.box{width:100%;max-width:820px;background:var(--card);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:24px;margin-bottom:20px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
h1{font-size:24px;margin-bottom:6px}
h2{font-size:18px;margin-bottom:16px;color:var(--blue)}
.muted{color:var(--muted);font-size:14px;line-height:1.6}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--orange);color:#fff;border:none;border-radius:8px;padding:11px 20px;font-weight:700;font-size:14px;cursor:pointer;transition:transform .2s;text-decoration:none}
.btn:hover{transform:translateY(-2px)}
.btn.sec{background:transparent;border:1px solid rgba(255,255,255,.2)}
.btn.blue-btn{background:var(--blue);color:#070a0e}
.btn.sm{padding:7px 12px;font-size:12px}
.btn.red{background:#9b1c1c}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
label{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px}
input,select,textarea{width:100%;background:#0b0f14;border:1px solid rgba(255,255,255,.12);border-radius:8px;color:#fff;padding:11px 12px;font-size:15px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue)}
textarea{min-height:260px;resize:vertical;line-height:1.6}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.check{display:flex;align-items:center;gap:10px;margin-top:16px}
.check input{width:auto}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.item{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 0;border-bottom:1px solid rgba(255,255,255,.08)}
.item:last-child{border:none}
.item b{display:block;font-size:15px;margin-bottom:3px}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:12px;margin-right:6px}
.on{background:#14532d}.off{background:#713f12}
.btns{display:flex;gap:6px;flex-wrap:wrap}
#app{width:100%;display:flex;flex-direction:column;align-items:center}
#app[hidden]{display:none}
#preview{display:none;margin-top:18px;padding:18px;background:#0b0f14;border-radius:10px;border:1px solid rgba(255,255,255,.1)}
#preview h2{color:var(--blue);border-left:4px solid var(--blue);padding-left:12px;margin:24px 0 12px}
#preview p{color:#cbd5e0;line-height:1.7;margin-bottom:14px}
#preview img{max-width:100%;border-radius:10px;margin:16px 0;border:1px solid rgba(255,255,255,.1)}
#preview li{list-style:none;background:var(--card);border-left:3px solid var(--orange);padding:10px 12px;margin-bottom:8px;border-radius:6px;color:#cbd5e0}
#coverBox{display:none;align-items:center;gap:14px;margin-top:12px}
#coverImg{width:160px;height:100px;object-fit:cover;border-radius:10px;border:1px solid rgba(255,255,255,.15)}
input[type=file]{padding:9px}
#msg{color:#fca5a5;margin-top:14px;font-size:14px}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--orange);padding:10px 18px;border-radius:8px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .3s;z-index:9999}
#toast.show{opacity:1}
@media (max-width:600px){.row{grid-template-columns:1fr}}
</style>
</head>
<body>

<section class="box" id="login" style="text-align:center;margin-top:60px">
<h1><i class="fas fa-lock"></i> Espace administrateur</h1>
<p class="muted" style="margin:10px 0 20px">Connexion réservée au propriétaire du blog.</p>
<button class="btn" id="btnLogin"><i class="fab fa-google"></i> Se connecter avec Google</button>
<p id="msg"></p>
</section>

<div id="app" hidden>

<section class="box">
<div class="top">
<div><h1>Administration du blog</h1><p class="muted" id="who"></p></div>
<div class="btns"><a class="btn sec sm" href="blog.html" target="_blank" rel="noopener"><i class="fas fa-eye"></i> Voir le blog</a><button class="btn sec sm" id="btnLogout"><i class="fas fa-sign-out-alt"></i> Déconnexion</button></div>
</div>
</section>

<section class="box">
<h2>Mes articles</h2>
<div id="list"><p class="muted">Chargement…</p></div>
</section>

<section class="box">
<h2 id="formTitle">Nouvel article</h2>
<label for="title">Titre</label><input id="title" maxlength="120">
<div class="row">
<div><label for="cat">Section</label>
<select id="cat"><option value="design">Design</option><option value="montage">Montage</option><option value="ia">IA</option><option value="autre">Autre</option></select></div>
<div><label for="date">Date</label><input id="date" type="date"></div>
</div>
<label for="excerpt">Résumé (150 caractères environ, affiché dans la carte et sur Google)</label><input id="excerpt" maxlength="200">
<label for="coverFile">Image de couverture (importée depuis votre appareil)</label>
<input id="coverFile" type="file" accept="image/*">
<input id="cover" type="hidden">
<div id="coverBox"><img id="coverImg" alt="Aperçu de la couverture"><button type="button" class="btn red sm" id="btnCoverClear"><i class="fas fa-times"></i> Retirer</button></div>

<div style="display:flex;justify-content:space-between;align-items:center;margin-top:16px;">
<label for="content" style="margin:0">Contenu de l'article</label>
<button type="button" class="btn blue-btn sm" id="btnInsertInlineImg"><i class="fas fa-image"></i> + Insérer une photo au milieu</button>
<input type="file" id="inlineImgFile" accept="image/*" style="display:none">
</div>

<textarea id="content" placeholder="Votre texte…"></textarea>
<p class="muted" style="margin-top:8px">Mise en forme : une ligne vide sépare les paragraphes · <b style="color:var(--blue)">## Titre</b> pour un sous-titre en bleu · <b>- </b> pour une liste · <b>**gras**</b> pour le gras.</p>
<div class="check"><input type="checkbox" id="pub" checked><label for="pub" style="margin:0;color:#fff">Publié (visible sur le blog)</label></div>
<div class="actions">
<button class="btn" id="btnSave"><i class="fas fa-save"></i> Enregistrer</button>
<button class="btn sec" id="btnPrev"><i class="fas fa-eye"></i> Aperçu</button>
<button class="btn sec" id="btnNew"><i class="fas fa-plus"></i> Nouveau</button>
</div>
<div id="preview"></div>
</section>
</div>

<div id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getFirestore, collection, getDocs, doc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

const app = initializeApp({
apiKey:"AIzaSyCBv8OFQyvjvSwYvPKS6A-Nc936I2ag8y8",
authDomain:"portfolio-josy.firebaseapp.com",
projectId:"portfolio-josy",
storageBucket:"portfolio-josy.firebasestorage.app",
messagingSenderId:"49013469804",
appId:"1:49013469804:web:5a72c64ddc9652cdf71e49",
measurementId:"G-3N3Z537MDP"
});
const db = getFirestore(app), auth = getAuth(app);
const ADMIN_EMAIL = 'josybratovo@gmail.com';
const BASE = 'https://portfolio-josy-ratovo.vercel.app/';
const $ = id => document.getElementById(id);
const CATS = {design:'Design',montage:'Montage',ia:'IA',autre:'Autre'};

const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inl = s => esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
function md(t){
const out=[]; let list=false;
String(t||'').split('\n').forEach(l=>{
l=l.trim();
if(l.startsWith('![') && l.includes('](')){
const match = l.match(/^!\[(.*?)\]\((.*?)\)$/);
if(match){ if(list){out.push('</ul>');list=false} out.push('<div style="text-align:center;margin:20px 0;"><img src="'+match[2]+'" alt="'+esc(match[1])+'" style="max-width:100%;border-radius:10px;box-shadow:0 4px 15px rgba(0,0,0,0.5);"></div>'); return; }
}
if(l.startsWith('- ')){ if(!list){out.push('<ul>');list=true} out.push('<li>'+inl(l.slice(2))+'</li>'); return; }
if(list){out.push('</ul>');list=false}
if(!l) return;
out.push(l.startsWith('## ') ? '<h2 style="color:var(--blue);border-left:4px solid var(--blue);padding-left:12px;margin:24px 0 12px;">'+inl(l.slice(3))+'</h2>' : '<p>'+inl(l)+'</p>');
});
if(list) out.push('</ul>');
return out.join('');
}
const slugify = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,60) || 'article';
const today = () => new Date().toISOString().slice(0,10);
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2400); }

let items = [], editing = null;

// ---------- CONNEXION ----------
$('btnLogin').onclick = async () => {
$('msg').textContent = '';
try{ await signInWithPopup(auth, new GoogleAuthProvider()); }
catch(e){ $('msg').textContent = 'Connexion impossible : ' + (e.code || e.message); }
};
$('btnLogout').onclick = () => signOut(auth);

onAuthStateChanged(auth, u => {
if(u && u.email === ADMIN_EMAIL){
$('login').hidden = true; $('app').hidden = false;
$('who').textContent = 'Connecté : ' + u.email;
loadList(); resetForm();
}else{
if(u){ $('msg').textContent = "Ce compte Google n'a pas accès à l'administration."; signOut(auth); }
$('login').hidden = false; $('app').hidden = true;
}
});

// ---------- LISTE DES ARTICLES ----------
async function loadList(){
try{
const s = await getDocs(collection(db,'articles'));
items = []; s.forEach(d => items.push({slug:d.id, ...d.data()}));
items.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
}catch(e){ $('list').innerHTML = '<p class="muted">Lecture impossible : vérifiez les règles Firestore.</p>'; return; }
$('list').innerHTML = items.length ? items.map(a=>`
<div class="item"><div><b>${esc(a.title)}</b>
<span class="badge ${a.published?'on':'off'}">${a.published?'Publié':'Brouillon'}</span>
<span class="muted">${CATS[a.cat]||'Autre'} · ${esc(a.date||'')}</span></div>
<div class="btns" data-s="${esc(a.slug)}">
<button class="btn sec sm" data-a="edit"><i class="fas fa-pen"></i> Modifier</button>
<button class="btn sec sm" data-a="copy"><i class="fas fa-link"></i> Lien</button>
<button class="btn sec sm" data-a="wa"><i class="fab fa-whatsapp"></i></button>
<button class="btn sec sm" data-a="fb"><i class="fab fa-facebook-f"></i></button>
<button class="btn sec sm" data-a="export"><i class="fas fa-file-export"></i> Exporter</button>
<button class="btn red sm" data-a="del"><i class="fas fa-trash"></i></button>
</div></div>`).join('') : '<p class="muted">Aucun article publié depuis l\'administration pour le moment.</p>';
}

$('list').addEventListener('click', async e => {
const b = e.target.closest('button[data-a]'); if(!b) return;
const slug = b.parentElement.dataset.s, a = items.find(x=>x.slug===slug);
const url = BASE + 'blog.html?a=' + encodeURIComponent(slug);
const act = b.dataset.a;
if(act==='export') exportArticle(a);
if(act==='edit'){ fill(a); window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'}); }
if(act==='copy'){ try{ await navigator.clipboard.writeText(url); toast('Lien copié !'); }catch(_){ prompt('Copiez ce lien :',url); } }
if(act==='wa') window.open('https://wa.me/?text='+encodeURIComponent(a.title+' '+url),'_blank','noopener');
if(act==='fb') window.open('https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(url),'_blank','noopener');
if(act==='del' && confirm('Supprimer définitivement « '+a.title+' » ?')){
try{ await deleteDoc(doc(db,'articles',slug)); toast('Article supprimé'); if(editing===slug) resetForm(); loadList(); }
catch(_){ toast('Suppression impossible'); }
}
});

// ---------- FORMULAIRE ----------
function fill(a){
editing = a.slug;
$('formTitle').textContent = 'Modifier l\'article';
$('title').value = a.title||'';
$('cat').value = a.cat || 'autre';
$('date').value = a.date || today();
$('excerpt').value = a.excerpt || '';
setCover(a.cover);
$('content').value = a.content||'';
$('pub').checked = !!a.published;
$('preview').style.display = 'none';
}
function resetForm(){
editing = null; $('formTitle').textContent = 'Nouvel article';
['title','excerpt','content'].forEach(i=>$(i).value=''); setCover('');
$('cat').value='design'; $('date').value=today(); $('pub').checked=true; $('preview').style.display='none';
}
$('btnNew').onclick = resetForm;
$('btnPrev').onclick = () => {
const p = $('preview');
p.innerHTML = '<h1 style="font-size:22px;margin-bottom:14px">'+esc($('title').value)+'</h1>'+md($('content').value);
p.style.display = p.style.display==='block' ? 'none' : 'block';
};

$('btnSave').onclick = async () => {
const title = $('title').value.trim(), content = $('content').value.trim();
if(!title || !content){ toast('Titre et contenu obligatoires'); return; }
let slug = editing;
if(!slug){
slug = slugify(title);
let n = 2, base = slug;
while(items.some(x=>x.slug===slug)) slug = base + '-' + n++;
}
try{
await setDoc(doc(db,'articles',slug), {
title, cat:$('cat').value, excerpt:$('excerpt').value.trim(), cover:$('cover').value.trim(),
content:$('content').value, date:$('date').value || today(), published:$('pub').checked,
updated:new Date().toISOString()
});
toast('Article enregistré'); editing = slug; await loadList();
}catch(e){ toast('Échec : vérifiez les règles Firestore'); console.error(e); }
};

// ---------- IMAGES (COMPRESSION & INSERTION) ----------
function setCover(v){
$('cover').value = v || '';
const i = $('coverImg');
if(v){ i.src = v; $('coverBox').style.display = 'flex'; }
else{ i.removeAttribute('src'); $('coverBox').style.display = 'none'; }
}
function shrink(file){
return new Promise((res, rej) => {
const img = new Image(), u = URL.createObjectURL(file);
img.onload = () => {
URL.revokeObjectURL(u);
let w = Math.min(1200, img.width), q = .82, out;
const c = document.createElement('canvas'), x = c.getContext('2d');
for(let k = 0; k < 6; k++){
c.width = w; c.height = Math.round(img.height * w / img.width);
x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
x.drawImage(img, 0, 0, c.width, c.height);
out = c.toDataURL('image/jpeg', q);
if(out.length < 600000) break;
w = Math.round(w * .8); q = Math.max(.6, q - .05);
}
res(out);
};
img.onerror = rej; img.src = u;
});
}
$('coverFile').addEventListener('change', async e => {
const f = e.target.files[0]; if(!f) return;
try{ setCover(await shrink(f)); toast('Image de couverture ajoutée'); }
catch(_){ toast('Image illisible'); }
e.target.value = '';
});
$('btnCoverClear').onclick = () => setCover('');

// Insertion d'image au milieu du contenu
$('btnInsertInlineImg').onclick = () => $('inlineImgFile').click();
$('inlineImgFile').addEventListener('change', async e => {
const f = e.target.files[0]; if(!f) return;
try{
const base64Img = await shrink(f);
const txtArea = $('content');
const imgTag = '\n\n![Image](' + base64Img + ')\n\n';
const start = txtArea.selectionStart, end = txtArea.selectionEnd;
txtArea.value = txtArea.value.substring(0, start) + imgTag + txtArea.value.substring(end);
toast('Photo insérée dans l\'article');
}catch(_){ toast('Échec de l\'insertion'); }
e.target.value = '';
});

// ---------- EXPORT ----------
const COLORS = {design:'#ff6b00',montage:'#00b4d8',ia:'#8b5cf6',autre:'#94a3b8'};
const fmtD = d => d ? new Date(d+'T00:00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'}) : '';
const EXPORT_CSS = ':root{--card:#16191d;--muted:#a0aec0;--orange:#e05e00;--blue:#00b4d8;--nav:#0b2e3b}*{box-sizing:border-box;margin:0;padding:0;font-family:"Segoe UI",Arial,sans-serif}body{background:#070a0e;color:#fff;padding:0 20px 80px;display:flex;flex-direction:column;align-items:center;min-height:100vh}'
+'.nav{position:sticky;top:0;width:100%;background:var(--nav);display:flex;justify-content:center;padding:12px 20px;margin-bottom:30px;box-shadow:0 4px 15px rgba(0,0,0,.5);z-index:1000}.nav div{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:1100px}.nav .r{display:flex;gap:20px;width:auto}'
+'.nav a{color:#fff;text-decoration:none;font-weight:600;font-size:15px;padding:8px 16px;border-radius:6px;display:flex;align-items:center;gap:8px}.nav a.on,.nav a:hover{color:#38bdf8;background:rgba(255,255,255,.08)}'
+'.article{width:100%;max-width:780px}.back{display:inline-flex;gap:8px;color:#38bdf8;text-decoration:none;font-weight:600;font-size:14px;margin-bottom:20px}'
+'.cover{width:100%;height:340px;border-radius:16px;overflow:hidden;background:var(--card);margin-bottom:28px}.cover img{width:100%;height:100%;object-fit:cover}'
+'.tag{display:inline-block;background:var(--c);color:#070a0e;font-size:12px;font-weight:800;text-transform:uppercase;padding:5px 14px;border-radius:20px;margin-bottom:14px}'
+'h1{font-size:34px;line-height:1.25;margin-bottom:14px}.meta{display:flex;flex-wrap:wrap;gap:18px;color:var(--muted);font-size:14px;padding-bottom:22px;margin-bottom:30px;border-bottom:1px solid rgba(255,255,255,.1)}.meta i{color:var(--orange);margin-right:6px}'
+'.content h2{font-size:22px;margin:48px 0 18px;padding-left:14px;border-left:4px solid var(--blue);color:var(--blue)}.content p{line-height:1.8;color:#cbd5e0;margin-bottom:20px;font-size:16px}.content ul{list-style:none;margin:8px 0}'
+'.content li{background:var(--card);border:1px solid rgba(255,255,255,.06);border-left:3px solid var(--orange);border-radius:8px;padding:14px 16px;margin-bottom:12px;line-height:1.7;color:#cbd5e0;font-size:15.5px}.content strong{color:#fff}'
+'.cta{display:flex;justify-content:center;margin-top:56px}.cta a{background:var(--orange);color:#fff;text-decoration:none;font-weight:700;padding:13px 30px;border-radius:8px;box-shadow:0 6px 18px rgba(224,94,0,.35)}'
+'@media(max-width:600px){body{padding:55px 15px 90px}.nav{position:fixed;top:auto;bottom:0;left:0;right:0;margin:0;padding:8px 0;background:#05161d}.nav .h span{display:none}.nav .r{width:100%;justify-content:space-around;gap:0}.nav a{flex-direction:column;gap:4px;font-size:11px;padding:6px 10px}.nav a i{font-size:18px}.cover{height:210px}h1{font-size:26px}}';

function dl(name, blob){
const a = document.createElement('a');
a.href = URL.createObjectURL(blob); a.download = name;
document.body.appendChild(a); a.click(); a.remove();
setTimeout(() => URL.revokeObjectURL(a.href), 3000);
}

async function exportArticle(a){
const url = BASE + 'blog-' + a.slug + '.html';
const isData = (a.cover || '').startsWith('data:');
const img = isData ? 'image/' + a.slug + '.jpg' : (a.cover || '');
const imgAbs = img ? (/^https?:/.test(img) ? img : BASE + img) : '';
const mins = Math.max(1, Math.round(String(a.content||'').split(/\s+/).length / 200));
const desc = a.excerpt || a.title;
const ld = JSON.stringify({"@context":"https://schema.org","@type":"BlogPosting","headline":a.title,"description":desc,"datePublished":a.date,"inLanguage":"fr","articleSection":CATS[a.cat]||'Autre',"mainEntityOfPage":url,"image":imgAbs||undefined,"author":{"@type":"Person","name":"Josy Ratovo"}}).replace(/</g,'\\u003c');
const html = [
'<!DOCTYPE html>','<html lang="fr">','<head>',
'<script async src="https://www.googletagmanager.com/gtag/js?id=G-TQ2EWFFFQJ"><\/script>',
'<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag("js",new Date());gtag("config","G-TQ2EWFFFQJ");<\/script>',
'<meta charset="UTF-8">','<meta name="viewport" content="width=device-width, initial-scale=1.0">',
'<title>'+esc(a.title)+' | Josy Ratovo</title>',
'<meta name="description" content="'+esc(desc)+'">',
'<meta name="robots" content="index, follow, max-image-preview:large">',
'<link rel="canonical" href="'+url+'">',
'<meta property="og:type" content="article">','<meta property="og:site_name" content="Josy Ratovo">','<meta property="og:locale" content="fr_FR">',
'<meta property="og:title" content="'+esc(a.title)+'">','<meta property="og:description" content="'+esc(desc)+'">','<meta property="og:url" content="'+url+'">',
imgAbs ? '<meta property="og:image" content="'+esc(imgAbs)+'">' : '',
'<meta name="twitter:card" content="summary_large_image">',
'<script type="application/ld+json">'+ld+'<\/script>',
'<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">',
'<style>'+EXPORT_CSS+'</style>','</head>','<body>',
